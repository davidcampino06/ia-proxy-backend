spring.application.name=ia-proxy-backend
server.port=${PORT:8080}

# Allowed CORS origins (comma separated). On Railway set ALLOWED_ORIGINS
# to your Vercel frontend URL, for example: https://ia-proxy-frontend.vercel.app
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173,https://*.vercel.app}

# Demo shortcuts (exhaust quota, seed history, reset account). Set DEMO_ENABLED=false to turn them off.
app.demo.enabled=${DEMO_ENABLED:true}
